<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>闭眼冲</title>
<style>
:root{
  --bg:#E9EDEA; --surface:#FFFFFF; --surface-soft:#F4F6F3;
  --ink:#2B3A35; --muted:#9AA8A1; --line:#DCE3DF;
  --accent:#4F9277; --accent-press:#447F68; --accent-soft:#E2EFE8;
  --radius:20px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);
  -webkit-font-smoothing:antialiased;line-height:1.55;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.wrap{width:100%;max-width:440px}
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:34px 30px;
  box-shadow:0 16px 46px -26px rgba(43,58,53,.5);
}
.home-link{display:inline-block;font-size:.78rem;color:var(--muted);text-decoration:none;margin-bottom:16px}
.home-link:hover{color:var(--accent)}
.top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:26px;gap:12px}
.brand{display:flex;flex-direction:column;gap:3px}
.brand .name{display:flex;align-items:center;gap:9px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.brand b{font-size:1rem;letter-spacing:.02em;color:var(--ink);font-weight:700}
.brand .sub{font-size:.74rem;color:var(--muted);padding-left:17px}
.recbtn{display:flex;flex-direction:column;align-items:flex-end;gap:2px;background:none;border:none;cursor:pointer;font-family:inherit;padding:2px}
.recbtn .lbl{font-size:.72rem;color:var(--muted);font-weight:600}
.recbtn:hover .lbl{color:var(--accent)}
.streak{text-align:right;font-size:.72rem;color:var(--muted);line-height:1.35}
.streak b{color:var(--accent);font-size:.95rem}

.daterow{font-size:.82rem;color:var(--muted);margin-bottom:16px}

/* 我的记录 页 */
.rec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.rec-back{background:none;border:none;color:var(--muted);font-family:inherit;font-size:.9rem;cursor:pointer;padding:4px}
.rec-back:hover{color:var(--ink)}
.rec-title{font-size:1.06rem;font-weight:600}
.rec-stats{display:flex;gap:26px;margin-bottom:24px}
.rec-stats .n{font-size:1.7rem;font-weight:700;color:var(--accent);line-height:1.1}
.rec-stats .k{font-size:.74rem;color:var(--muted);margin-top:3px}
.cal-month{font-size:.82rem;color:var(--muted);margin-bottom:10px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal .wd{font-size:.66rem;color:var(--muted);text-align:center;padding-bottom:2px}
.cal .d{aspect-ratio:1;border-radius:9px;background:var(--surface-soft);
  display:flex;align-items:center;justify-content:center;font-size:.74rem;color:var(--muted)}
.cal .d.empty{background:none}
.cal .d.on{background:var(--accent);color:#fff;font-weight:600}
.cal .d.today{box-shadow:0 0 0 2px var(--accent-soft) inset,0 0 0 2px var(--accent)}
.rec-sum{margin-top:22px;color:var(--muted);font-size:.9rem;text-align:center;line-height:1.6}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:none}
.box{
  flex:none;width:27px;height:27px;border-radius:50%;border:2px solid var(--line);
  background:none;transition:.18s;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:.88rem;
}
.item.on .box{background:var(--accent);border-color:var(--accent);animation:tick .3s ease}
@keyframes tick{0%{transform:scale(.7)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
.item .t{font-size:1.1rem;font-weight:600}
.item.on .t{color:var(--muted);text-decoration:line-through}

.progress{margin-top:18px;font-size:.86rem;color:var(--muted)}
.progress.done{color:var(--accent);font-weight:600}

.btn{
  margin-top:14px;width:100%;border:none;cursor:pointer;font-family:inherit;
  font-size:1rem;font-weight:600;color:#fff;background:var(--accent);
  padding:14px;border-radius:14px;transition:background .15s,transform .06s;
}
.btn:hover{background:var(--accent-press)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:none;color:var(--muted);font-weight:500;padding:10px;font-size:.88rem}
.btn.ghost:hover{color:var(--ink)}

/* edit mode */
.editrow{display:flex;gap:8px;margin-bottom:9px}
.editrow input{
  flex:1;font-family:inherit;font-size:1rem;color:var(--ink);
  background:var(--surface-soft);border:1px solid var(--line);
  border-radius:12px;padding:12px 13px;transition:.15s;
}
.editrow input:focus{outline:none;border-color:var(--accent);background:#fff}
.editrow .del{
  border:1px solid var(--line);background:var(--surface-soft);color:var(--muted);
  border-radius:12px;width:46px;flex:none;cursor:pointer;font-size:1.1rem;
}
.editrow .del:hover{color:var(--ink)}
.addrow{
  background:none;border:1px dashed var(--line);color:var(--muted);
  width:100%;border-radius:12px;padding:11px;cursor:pointer;font-family:inherit;
  font-size:.88rem;margin-top:3px;transition:.15s;
}
.addrow:hover{color:var(--accent);border-color:var(--accent)}
.edit-hint{font-size:.78rem;color:var(--muted);margin:0 0 16px}

.view{display:none}
[data-view="list"] .v-list{display:block}
[data-view="edit"] .v-edit{display:block}
[data-view="record"] .v-record{display:block}
.empty{color:var(--muted);font-size:.92rem;padding:20px 0;text-align:center}

.nudge-overlay{position:fixed;inset:0;background:rgba(43,58,53,.72);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
.nudge-card{background:var(--ink);color:#fff;border-radius:20px;padding:32px 26px;max-width:360px;text-align:center;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);animation:nudge-in .25s ease both}
@keyframes nudge-in{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.nudge-text{font-size:1.15rem;font-weight:700;line-height:1.5;margin:0 0 22px;letter-spacing:.01em}
.nudge-btn{width:100%;border:none;cursor:pointer;font-family:inherit;font-size:1rem;font-weight:700;
  color:var(--ink);background:#fff;padding:14px;border-radius:14px;transition:transform .06s}
.nudge-btn:active{transform:translateY(1px)}
</style>
</head>
<body>
<div class="nudge-overlay" id="nudgeOverlay">
  <div class="nudge-card">
    <p class="nudge-text" id="nudgeText"></p>
    <button class="nudge-btn" id="nudgeBtn">去做</button>
  </div>
</div>
<div class="wrap">
  <div class="card" id="card" data-view="list">
    <a class="home-link" href="index.html">‹ 首页</a>
    <div class="top">
      <div class="brand">
        <span class="name"><span class="dot"></span><b>闭眼冲</b></span>
        <span class="sub">一次定好,之后别想,照做就行</span>
      </div>
      <button class="recbtn" id="openRec">
        <span class="lbl">我的记录 ›</span>
        <span class="streak" id="streak"></span>
      </button>
    </div>

    <!-- 清单(每天打勾) -->
    <div class="view v-list">
      <div class="daterow" id="dateRow"></div>
      <div class="list" id="list"></div>
      <p class="progress" id="progress"></p>
      <button class="btn ghost" id="toEdit">编辑清单</button>
    </div>

    <!-- 编辑(增删改) -->
    <div class="view v-edit">
      <p class="edit-hint">写下你每天想照做的事。一次定好,之后就别再纠结。</p>
      <div id="editList"></div>
      <button class="addrow" id="addItem">+ 添加一项</button>
      <button class="btn" id="doneEdit">完成</button>
    </div>

    <!-- 我的记录 -->
    <div class="view v-record">
      <div class="rec-head">
        <span class="rec-title">我的记录</span>
        <button class="rec-back" id="recBack">← 返回</button>
      </div>
      <div class="rec-stats">
        <div><div class="n" id="recTotal">0</div><div class="k">累计天数</div></div>
        <div><div class="n" id="recStreak">0</div><div class="k">连续天数</div></div>
      </div>
      <div class="cal-month" id="calMonth"></div>
      <div class="cal" id="cal"></div>
      <p class="rec-sum" id="recSum"></p>
    </div>
  </div>
</div>

<script>
(function(){
  const KEY='zhaozuo_v1';
  const card=document.getElementById('card');
  const day=d=>new Date(d).toLocaleDateString('sv');
  const uid=()=>Math.random().toString(36).slice(2,8);
  function buzz(){try{if(navigator.vibrate)navigator.vibrate(12)}catch(e){}}

  function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}

  let data=load();
  if(!data){
    data={items:[
      {id:uid(),text:'早起'},
      {id:uid(),text:'喝水'},
      {id:uid(),text:'看书'},
      {id:uid(),text:'运动'},
    ],log:{}};
    save();
  }
  if(!data.log)data.log={};

  const todayKey=()=>day(Date.now());
  function todayChecked(){return data.log[todayKey()]||[]}

  function computeStreak(){
    let count=0, d=Date.now();
    if(!(data.log[day(d)]&&data.log[day(d)].length)) d-=864e5;
    while(data.log[day(d)]&&data.log[day(d)].length){count++; d-=864e5;}
    return count;
  }

  function renderStreak(){
    const s=computeStreak();
    document.getElementById('streak').innerHTML = s>0 ? '连续<br><b>'+s+'</b> 天' : '';
  }

  const NUDGE_BASE=[
    '这些事一定要做啊。别偷懒,别让以后的自己后悔。',
    '都说了多少次了——一定要做,别再拖。',
    '别偷懒。现在拖一下,以后就要还的。',
    '别让自己看不起自己——现在,去做。',
    '你自己说要闭眼冲的。现在,冲。'
  ];
  const NUDGE_STREAK=[
    s=>'连续 '+s+' 天了,别断在今天。',
    s=>'你已经赢了 '+s+' 天。今天,别认输。'
  ];
  const NUDGE_EVENING=[
    '今天只剩几个小时了。别把"闭眼冲"变成一句空话。',
    '再拖,今天就要交白卷了。'
  ];

  function pickNudge(){
    const s=computeStreak();
    const hour=new Date().getHours();
    const pool=[];
    if(s>=3) NUDGE_STREAK.forEach(f=>pool.push(f(s)));
    if(hour>=20) pool.push(...NUDGE_EVENING);
    pool.push(...NUDGE_BASE);
    return pool[Math.floor(Math.random()*pool.length)];
  }

  function maybeShowNudge(){
    const overlay=document.getElementById('nudgeOverlay');
    if(data.items.length>0 && todayChecked().length<data.items.length){
      document.getElementById('nudgeText').textContent=pickNudge();
      overlay.style.display='flex';
    }else{
      overlay.style.display='none';
    }
  }
  document.getElementById('nudgeBtn').onclick=()=>{
    document.getElementById('nudgeOverlay').style.display='none';
  };

  function totalDays(){
    return Object.keys(data.log).filter(k=>data.log[k]&&data.log[k].length>0).length;
  }

  function openRecord(){
    document.getElementById('recTotal').textContent=totalDays();
    document.getElementById('recStreak').textContent=computeStreak();
    const now=new Date();
    const Y=now.getFullYear(), M=now.getMonth();
    document.getElementById('calMonth').textContent=Y+' 年 '+(M+1)+' 月';
    const first=new Date(Y,M,1).getDay();
    const lead=(first+6)%7;
    const dim=new Date(Y,M+1,0).getDate();
    const todayStr=day(Date.now());
    const cal=document.getElementById('cal'); cal.innerHTML='';
    ['一','二','三','四','五','六','日'].forEach(w=>{
      const e=document.createElement('div');e.className='wd';e.textContent=w;cal.appendChild(e);
    });
    for(let i=0;i<lead;i++){const e=document.createElement('div');e.className='d empty';cal.appendChild(e);}
    let active=0;
    for(let dnum=1;dnum<=dim;dnum++){
      const ds=Y+'-'+String(M+1).padStart(2,'0')+'-'+String(dnum).padStart(2,'0');
      const e=document.createElement('div');e.className='d';e.textContent=dnum;
      if(data.log[ds]&&data.log[ds].length>0){e.classList.add('on');active++;}
      if(ds===todayStr)e.classList.add('today');
      cal.appendChild(e);
    }
    document.getElementById('recSum').textContent = active>0
      ? '这个月,你照做了 '+active+' 天。看,亮了这么多。'
      : '这个月还空着——照做一次,就点亮第一格。';
    card.dataset.view='record';
  }

  const weekday=['日','一','二','三','四','五','六'];
  function renderDate(){
    const n=new Date();
    document.getElementById('dateRow').textContent =
      '今天 · 周'+weekday[n.getDay()]+' · '+(n.getMonth()+1)+'月'+n.getDate()+'日';
  }

  function renderList(){
    renderDate();
    const list=document.getElementById('list'); list.innerHTML='';
    if(data.items.length===0){
      list.innerHTML='<div class="empty">还没有清单。点下面「编辑清单」,写下你每天想做的事。</div>';
      document.getElementById('progress').textContent='';
    }else{
      const checked=todayChecked();
      data.items.forEach(it=>{
        const on=checked.includes(it.id);
        const row=document.createElement('div');
        row.className='item'+(on?' on':'');
        row.innerHTML='<span class="box">✓</span><span class="t"></span>';
        row.querySelector('.t').textContent=it.text;
        row.onclick=()=>toggle(it.id);
        list.appendChild(row);
      });
      const done=todayChecked().length, total=data.items.length;
      const p=document.getElementById('progress');
      if(done>=total&&total>0){p.className='progress done';p.textContent='今天,照做完了。';}
      else{p.className='progress';p.textContent='今天 '+done+' / '+total;}
    }
    renderStreak();
  }

  function toggle(id){
    const t=todayKey();
    const arr=data.log[t]||[];
    const i=arr.indexOf(id);
    if(i>=0)arr.splice(i,1); else {arr.push(id);buzz();}
    data.log[t]=arr; save(); renderList();
  }

  // 编辑
  function addEditRow(text){
    const row=document.createElement('div');row.className='editrow';
    row.innerHTML='<input type="text" placeholder="例如:冥想 5 分钟"><button class="del">×</button>';
    const inp=row.querySelector('input'); if(text)inp.value=text;
    row.querySelector('.del').onclick=()=>row.remove();
    document.getElementById('editList').appendChild(row);
    return inp;
  }
  function openEdit(){
    const box=document.getElementById('editList'); box.innerHTML='';
    if(data.items.length===0)addEditRow('');
    else data.items.forEach(it=>addEditRow(it.text));
    card.dataset.view='edit';
  }
  function saveEdit(){
    const vals=[...document.querySelectorAll('#editList input')].map(i=>i.value.trim()).filter(Boolean);
    // 保留已有项的 id(按文字匹配),新项给新 id —— 这样打勾记录不乱
    const oldByText={}; data.items.forEach(it=>oldByText[it.text]=it.id);
    data.items=vals.map(v=>({id:oldByText[v]||uid(),text:v}));
    save(); card.dataset.view='list'; renderList(); maybeShowNudge();
  }

  document.getElementById('toEdit').onclick=openEdit;
  document.getElementById('addItem').onclick=()=>addEditRow('').focus();
  document.getElementById('doneEdit').onclick=saveEdit;
  document.getElementById('openRec').onclick=openRecord;
  document.getElementById('recBack').onclick=()=>{card.dataset.view='list';renderList();maybeShowNudge();};

  renderList();
  maybeShowNudge();
})();
</script>
</body>
</html>
