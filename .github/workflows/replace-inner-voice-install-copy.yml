name: Replace Inner Voice install copy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/replace-inner-voice-install-copy.yml

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace browser wording only
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('inner-voice/index.html'): [
                  (
                      '用 Chrome 打开，点右上角菜单 → “安装应用”或“添加到主屏幕”。',
                      '用手机自带浏览器打开，点浏览器菜单 → “添加到桌面”或“添加到主屏幕”（不同手机名称可能不同）。',
                  ),
              ],
              Path('inner-voice/install.html'): [
                  (
                      '请用 Chrome 打开本页，点浏览器菜单 → “安装应用”或“添加到主屏幕”。',
                      '请用手机自带浏览器打开本页，点浏览器菜单 → “添加到桌面”或“添加到主屏幕”（不同手机名称可能不同）。',
                  ),
                  (
                      '用 Chrome 打开本页，点浏览器菜单 → “安装应用”或“添加到主屏幕”。',
                      '用手机自带浏览器打开本页，点浏览器菜单 → “添加到桌面”或“添加到主屏幕”（不同手机名称可能不同）。',
                  ),
              ],
          }

          changed = False
          for path, pairs in replacements.items():
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed = True

          workflow = Path('.github/workflows/replace-inner-voice-install-copy.yml')
          if workflow.exists():
              workflow.unlink()
              changed = True

          if not changed:
              raise SystemExit('No matching text found; nothing changed.')
          PY
      - name: Commit exact wording change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inner-voice/index.html inner-voice/install.html .github/workflows/replace-inner-voice-install-copy.yml
          git commit -m "Use China-friendly browser wording for Inner Voice install prompt"
          git push
