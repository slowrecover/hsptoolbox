<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inner Voice · 先把事实放回来</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f5f1e8;color:#24231f;max-width:680px;margin:auto;padding:32px}h1{font-size:42px}textarea{width:100%;height:120px;padding:16px;border-radius:16px;border:1px solid #ddd;font-size:18px}button{margin-top:16px;padding:14px 22px;border:0;border-radius:30px;background:#285f4d;color:white;font-size:16px}.box{background:#fffdf8;padding:22px;border-radius:20px;margin-top:20px}.tag{color:#285f4d;font-weight:bold}</style></head><body><h1>先把事实放回来。</h1><p>有时候痛苦不是因为发生了一件事，而是这件事悄悄变成了“我是怎样的人”。</p><div class="box"><p class="tag">写下脑子里最刺耳的一句话</p><textarea id="input" placeholder="例如：我就是一个失败的人"></textarea><button onclick="analyze()">看看发生了什么</button></div><div id="out"></div><script>function analyze(){let x=document.getElementById('input').value;let out=document.getElementById('out');let flags=[];if(/我就是|我是一个|我是个/.test(x))flags.push('人格判决：一件事变成了对整个人的评价');if(/永远|从来|都|所有|没人/.test(x))flags.push('范围扩大：一次经历被扩大成了全部经历');if(/应该|必须|早该/.test(x))flags.push('应该化：给自己增加了一个绝对标准');out.innerHTML='<div class="box"><b>我看到的语言变化：</b><p>'+flags.join('<br>')+'</p><p>现在试着回答：</p><p>① 真正发生了什么？（能被看到、听到、记录的事实）</p><p>② 哪部分只是我的解释？</p><p>③ 如果朋友遇到同样事情，我会怎么描述？</p><textarea placeholder="写下更准确的一句话"></textarea></div>'}</script></body></html>
