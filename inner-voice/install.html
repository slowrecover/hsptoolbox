<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f0e7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inner Voice">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon.svg">
<title>把 Inner Voice 放到桌面</title>
<style>
:root{color-scheme:light;--paper:#f4f0e7;--surface:#fffdf8;--ink:#24231f;--muted:#6f6b62;--line:#ddd5c7;--accent:#2e6552;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 94% 4%,rgba(46,101,82,.09),transparent 28rem),var(--paper);color:var(--ink)}main{width:min(100% - 28px,620px);margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 0 max(36px,env(safe-area-inset-bottom))}.brand{margin:0 0 42px;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.1em}.card{padding:clamp(24px,6vw,38px);border:1px solid var(--line);border-radius:26px;background:var(--surface);box-shadow:0 22px 70px rgba(48,42,31,.08)}h1{margin:0 0 14px;font-family:Georgia,"Noto Serif SC",serif;font-size:clamp(36px,10vw,56px);font-weight:500;line-height:1.08;letter-spacing:-.04em}p,li{line-height:1.75}.intro{color:var(--muted)}.steps{margin:28px 0;padding:0;list-style:none;counter-reset:item}.steps li{position:relative;margin:0 0 14px;padding:16px 16px 16px 52px;border:1px solid var(--line);border-radius:16px;background:#fff}.steps li:before{counter-increment:item;content:counter(item);position:absolute;left:16px;top:16px;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:#e5efe9;color:var(--accent);font-size:13px;font-weight:800}.btn{width:100%;min-height:50px;border:0;border-radius:999px;padding:13px 20px;background:var(--accent);color:white;font:inherit;font-weight:800;cursor:pointer}.btn.secondary{margin-top:10px;border:1px solid var(--line);background:transparent;color:var(--ink)}.note{margin-top:18px;color:var(--muted);font-size:13px;text-align:center}.status{margin:16px 0 0;color:var(--accent);font-weight:750;text-align:center}[hidden]{display:none!important}</style>
</head>
<body>
<main>
<p class="brand">INNER VOICE · 桌面安装</p>
<section class="card">
<h1>把它放到手机桌面。</h1>
<p class="intro">以后可以像打开一个小应用一样直接进入。你写下的内容仍然只留在当前设备中，不会上传。</p>
<ol class="steps" id="manualSteps">
<li><strong>iPhone：</strong>请用 Safari 打开本页，点底部“分享”图标。</li>
<li>向下找到并点击<strong>“添加到主屏幕”</strong>。</li>
<li>点击右上角<strong>“添加”</strong>。</li>
</ol>
<button class="btn" id="installBtn" type="button">检查能否直接安装</button>
<button class="btn secondary" id="openBtn" type="button">返回 Inner Voice</button>
<p class="status" id="status"></p>
<p class="note">Android：在 Chrome 右上角菜单中也可以选择“安装应用”或“添加到主屏幕”。</p>
</section>
</main>
<script>
let deferredPrompt=null;
const installBtn=document.getElementById('installBtn');
const status=document.getElementById('status');
const manualSteps=document.getElementById('manualSteps');
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredPrompt=event;installBtn.textContent='立即安装到桌面';status.textContent='你的浏览器支持直接安装。';});
installBtn.addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();const choice=await deferredPrompt.userChoice;status.textContent=choice.outcome==='accepted'?'已发送安装请求。':'你暂时取消了安装。';deferredPrompt=null;return;}status.textContent='没有出现直接安装按钮时，请按上面的 Safari / Chrome 步骤操作。';manualSteps.scrollIntoView({behavior:'smooth',block:'center'});});
document.getElementById('openBtn').addEventListener('click',()=>location.href='./?v=4');
window.addEventListener('appinstalled',()=>{installBtn.textContent='已经放到桌面';installBtn.disabled=true;status.textContent='安装完成。';});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script>
</body>
</html>
